alerts:
  - name: high_latency_p95
    severity: P2
    condition: 'p95(latency_ms) of event == "response_sent" over 5m > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: Đinh Công Tú (on-call LLMOps)
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: P1
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 over 5m > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: Đinh Công Tú (on-call LLMOps)
    runbook: docs/alerts.md#alert-2
  - name: cost_per_request_spike
    severity: P3
    condition: 'avg(cost_usd) of event == "response_sent" over 15m > 0.004 (2x baseline 0.002 USD/request)'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: Đinh Công Tú (on-call LLMOps)
    runbook: docs/alerts.md#alert-3
